name: refresh-data

# 刷新策略(北京时间):
#   高峰期 08:00 - 次日 03:00  每 5 分钟一轮
#       覆盖日盘(9:00-15:00)、夜盘(21:00-23:00, 贵金属/原油到 02:30)、外盘主要时段
#   低峰期 03:00 - 08:00     每 20 分钟一轮
#       国内休市、美股已收盘, 主要更新新闻资讯
#
# 为什么不用 cron 分档: 实测本仓库的 schedule 事件不触发(多次验证均为 0 次自动运行),
# 因此改为"一个 job 连续跑若干小时, 结束前用 GITHUB_TOKEN 拉起下一班"的自接力方式,
# 不依赖 GitHub 调度, 也不需要用户提供任何令牌。
# 停止方法: 在 Actions 页面 Cancel 掉运行中的 job 即可(被取消时不会拉起下一班)。
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-data
  # 取消进行中的长循环会造成刷新断档, 因此让新任务排队等待
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub 单个 job 上限 6 小时, 这里每班最多 5.5 小时后自行交接
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    env:
      TZ: Asia/Shanghai
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 缓存槽按"日期 + 是否收盘后"分档: 同一时段内复用同一个 key,
      # 避免每轮都新建一份 9MB 缓存(5 分钟一档时 3 天就会撑爆 10GB 配额)
      - name: 计算缓存槽位
        id: slot
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          H=$(TZ=Asia/Shanghai date +%H)
          if [ "$H" -ge 16 ]; then P="close"; else P="intraday"; fi
          echo "key=qb-kline-${D}-${P}" >> "$GITHUB_OUTPUT"
          echo "缓存槽: qb-kline-${D}-${P} (北京时间 $(TZ=Asia/Shanghai date '+%F %H:%M'))"

      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            data/kline_cache.json
            data/basis_days.json
          key: ${{ steps.slot.outputs.key }}
          restore-keys: |
            qb-kline-

      # schedule 触发时只跑一轮(交给 cron 频率); 手动/自接力触发时跑满一个班
      - name: 循环刷新
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bash tools/refresh_once.sh || echo "!! 本轮出错"
            exit 0
          fi
          END=$((SECONDS + 19800))   # 5.5 小时
          N=0
          while [ "$SECONDS" -lt "$END" ]; do
            N=$((N + 1))
            echo "===== 第 $N 轮 $(TZ=Asia/Shanghai date '+%F %H:%M:%S') ====="
            bash tools/refresh_once.sh || echo "!! 本轮出错, 继续"
            H=$(TZ=Asia/Shanghai date +%H)
            if [ "$H" -ge 3 ] && [ "$H" -lt 8 ]; then
              GAP=1180   # 低峰: 约 20 分钟
            else
              GAP=265    # 高峰: 约 5 分钟(抓取本身约 35 秒)
            fi
            LEFT=$((END - SECONDS))
            if [ "$LEFT" -le "$GAP" ]; then break; fi
            sleep "$GAP"
          done
          echo "本班结束, 共 $N 轮"

      # 交接给下一班, 保持 5 分钟刷新不中断
      - name: 拉起下一班
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/${REPO}/actions/workflows/refresh.yml/dispatches")
            echo "拉起下一班: HTTP $code (第 $i 次)"
            [ "$code" = "204" ] && break
            sleep 20
          done
