name: refresh-data

# 两种触发方式:
#   1) schedule(每 5 分钟): 理想路径, 由 GitHub 自行调度, 每次只跑 1 轮。
#   2) workflow_dispatch(手动/外部调用): 一次启动后内部跑 12 轮, 每轮间隔 5 分钟,
#      约 60 分钟。用于 GitHub 调度未生效时由外部每小时拉起一次来维持 5 分钟刷新。
# 分钟位刻意避开整点(3,8,13...), 否则 GitHub 调度高峰会延迟 10-30 分钟。
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '本轮启动后连续刷新次数(每轮间隔 5 分钟)'
        required: false
        default: '12'

concurrency:
  group: refresh-data
  # 取消进行中的长循环会造成刷新断档, 因此让新任务排队等待
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    # 服务器默认 UTC: 不设时区会让数据时间比北京时间早 8 小时, 前端显示成"早上6点的数据"
    env:
      TZ: Asia/Shanghai
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 缓存槽按"日期 + 是否收盘后"分档: 同一时段内复用同一个 key,
      # 避免每轮都新建一份 9MB 缓存(5 分钟一档时 3 天就会撑爆 10GB 配额)
      - name: 计算缓存槽位
        id: slot
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          H=$(TZ=Asia/Shanghai date +%H)
          if [ "$H" -ge 16 ]; then P="close"; else P="intraday"; fi
          echo "key=qb-kline-${D}-${P}" >> "$GITHUB_OUTPUT"
          echo "缓存槽: qb-kline-${D}-${P} (北京时间 $(TZ=Asia/Shanghai date '+%F %H:%M'))"

      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            data/kline_cache.json
            data/basis_days.json
          key: ${{ steps.slot.outputs.key }}
          restore-keys: |
            qb-kline-

      - name: 循环刷新(交易时段每 5 分钟一轮)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ROUNDS=1
          else
            ROUNDS="${{ github.event.inputs.rounds }}"
            [ -z "$ROUNDS" ] && ROUNDS=12
          fi
          echo "触发方式=${{ github.event_name }} 轮数=$ROUNDS"
          for i in $(seq 1 "$ROUNDS"); do
            echo "===== 第 $i/$ROUNDS 轮 ====="
            bash tools/refresh_once.sh || echo "!! 本轮出错, 继续下一轮"
            if [ "$i" -lt "$ROUNDS" ]; then sleep 290; fi
          done
