name: _probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 用 GITHUB_TOKEN 拉起目标任务
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/_probe_target.yml/dispatches")
          echo "GITHUB_TOKEN 拉起返回 HTTP $code"
